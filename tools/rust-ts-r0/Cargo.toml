[package]
name = "semctx-r0-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[features]
qualification-observer = []

[[test]]
name = "qualification_replay"
path = "qualification/qualification_replay.rs"
required-features = ["qualification-observer"]

[dependencies]
ts_goport = { version = "=7.0.0-dev", git = "https://github.com/hoklims/ts-rust.git", rev = "d1f3c0c442ab71a2fce7a01980ed892bd27b9842", default-features = false, features = ["noembed"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ryu-js = "=1.0.2"
unicode-normalization = "=0.1.25"
semctx-gates = { version = "=0.1.0", path = "../gates" }

[profile.dev]
debug = 0
