name: Bug report
description: Report a reproducible Semctx defect without sharing private source or secrets.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Review SUPPORT.md first. Use a synthetic reproduction and remove secrets or private repository content.
  - type: input
    id: semctx-version
    attributes:
      label: Semctx version
      placeholder: 0.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Bun version, and host (CLI, Codex, Claude Code, OMP, or GitHub Actions).
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or action
      description: Provide the exact safe command or interaction. Remove paths, tokens, and private arguments.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include stable reason codes and a reviewed allowlisted support report when useful.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal safe reproduction
      description: Prefer a small synthetic repository or public fixture. Do not attach private source or secrets.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, personal data, private source, and proprietary logs.
          required: true
