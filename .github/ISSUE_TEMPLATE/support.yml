name: Usage or setup question
description: Ask for help after checking the documentation and troubleshooting guide.
title: "[Support] "
labels:
  - support
body:
  - type: markdown
    attributes:
      value: |
        Check the documentation index and troubleshooting guide first. Share only narrow,
        privacy-reviewed diagnostics; never attach repository source, secrets, or a full database.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to accomplish, and where are you blocked?
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What you tried
      description: List the documentation or commands you already tried and the safe result.
    validations:
      required: true
  - type: input
    id: semctx-version
    attributes:
      label: Semctx version
      placeholder: bunx semctx@0.2.0 --version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Bun version, host, and installation method. Do not include secrets.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private source, proprietary logs, personal data, and full database contents.
          required: true
