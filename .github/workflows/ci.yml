name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    env:
      SEMCTX_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      SEMCTX_VERIFY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Provision the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Build the gate engine
        run: cargo build --manifest-path tools/gates/Cargo.toml --locked --release
      - id: select
        name: Select required verification lanes
        env:
          SEMCTX_PLAN_PATH: ${{ runner.temp }}/gate-plan.json
        run: |
          tools/gates/target/release/semctx-gates ci-plan --root "$GITHUB_WORKSPACE" --base "$SEMCTX_VERIFY_BASE" --head "$SEMCTX_VERIFY_HEAD" --output "$SEMCTX_PLAN_PATH"
          bun -e 'const p = await Bun.file(process.env.SEMCTX_PLAN_PATH).json(); await Bun.write(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify(p.matrix) + "\n")'
      - name: Retain the exact plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-gate-plan
          path: ${{ runner.temp }}/gate-plan.json
          if-no-files-found: error

  gates:
    needs: plan
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SEMCTX_VERIFY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      SEMCTX_CI_PROFILE: ${{ matrix.profile }}
      SEMCTX_CI_OS: ${{ matrix.os }}
      SEMCTX_CI_TARGETS: ${{ matrix.targets }}
      SEMCTX_CI_SMOKE: ${{ matrix.smoke }}
      SEMCTX_CI_SHARD: ${{ matrix.shard }}
      GATE_BIN: tools/gates/target/release/semctx-gates${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Provision the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Build the gate engine
        run: cargo build --manifest-path tools/gates/Cargo.toml --locked --release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-gate-plan
          path: ${{ runner.temp }}/plan
      - run: python -m pip install --disable-pip-version-check --requirement requirements-quality.txt
      - run: bun install --frozen-lockfile
      - name: Provision the source fallback dependency
        if: matrix.smoke == 'true' && (matrix.shard == '' || startsWith(matrix.shard, '1/'))
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            case "$RUNNER_OS" in
              Linux)
                sudo apt-get update
                sudo apt-get install --no-install-recommends -y ripgrep
                ;;
              macOS) brew install ripgrep ;;
              Windows) choco install ripgrep -y --no-progress ;;
              *) exit 1 ;;
            esac
          fi
          rg --version
      - name: Run selected verification lane
        env:
          SEMCTX_LANE_INDEX: ${{ matrix.index }}
          SEMCTX_RECEIPT: ${{ runner.temp }}/receipts/receipt-${{ matrix.index }}.json
        run: '"$GATE_BIN" ci-run --root "$GITHUB_WORKSPACE" --plan "$RUNNER_TEMP/plan/gate-plan.json" --lane "$SEMCTX_LANE_INDEX" --receipt "$SEMCTX_RECEIPT"'
      - name: Retain the lane receipt even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-gate-receipt-${{ matrix.index }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
      - name: Materialize the observed worker report
        if: matrix.smoke == 'true' && (matrix.shard == '' || startsWith(matrix.shard, '1/'))
        env:
          SEMCTX_RECEIPT: ${{ runner.temp }}/receipts/receipt-${{ matrix.index }}.json
          SEMCTX_WORKER_REPORT: ${{ runner.temp }}/worker-report.json
        run: |
          bun -e 'const r = await Bun.file(process.env.SEMCTX_RECEIPT).json(); const s = r.steps.find(s => s.action.label === "worker equivalence smoke"); if (!s || s.outcome.kind !== "success") throw new Error("worker observation missing"); JSON.parse(s.outcome.stdout); await Bun.write(process.env.SEMCTX_WORKER_REPORT, s.outcome.stdout)'
      - name: Archive complete worker benchmark report
        if: matrix.smoke == 'true' && (matrix.shard == '' || startsWith(matrix.shard, '1/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multicore-index-${{ matrix.os }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/worker-report.json
          if-no-files-found: error

  rust-gates:
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    defaults:
      run:
        shell: bash
    env:
      QUALIFICATION_BIN: tools/qualification/target/release/semctx-qualification${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - name: Provision the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting and lints
        run: |
          cargo fmt --manifest-path tools/gates/Cargo.toml --check
          cargo fmt --manifest-path tools/qualification/Cargo.toml --check
          cargo clippy --manifest-path tools/gates/Cargo.toml --locked --all-targets -- -D warnings
          cargo clippy --manifest-path tools/qualification/Cargo.toml --locked --all-targets -- -D warnings
      - name: Execute native Rust tests
        run: |
          cargo test --manifest-path tools/gates/Cargo.toml --locked
          cargo test --manifest-path tools/qualification/Cargo.toml --locked
      - name: Discover and execute native product workspaces
        run: cargo run --manifest-path tools/gates/Cargo.toml --locked -- rust-test --root "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/native-product-tests.json"
      - name: Retain native product discovery and execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-product-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/native-product-tests.json
          if-no-files-found: error
      - name: Require the tested source to remain unchanged
        run: git diff --exit-code HEAD
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-gate-plan
          path: ${{ runner.temp }}/plan
      - run: bun install --frozen-lockfile
      - name: Build the candidate CLI and the native qualification runner
        run: |
          bun run cli:build
          cargo build --manifest-path tools/qualification/Cargo.toml --locked --release
      - name: Qualify the actual CLI and MCP artifacts
        env:
          SEMCTX_QUALIFICATION_OS: ${{ matrix.os }}
        run: '"$QUALIFICATION_BIN" --cli "$GITHUB_WORKSPACE/apps/cli/dist/index.js" --mcp "$GITHUB_WORKSPACE/plugins/semctx-control/dist/semctx-mcp.js" --runtime "$(bun -p process.execPath)" --out "$RUNNER_TEMP/qualification" --plan "$RUNNER_TEMP/plan/gate-plan.json" --os "$SEMCTX_QUALIFICATION_OS"'
      - name: Retain the qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/qualification/
          if-no-files-found: error

  semctx-required:
    name: semctx-required
    if: always()
    needs: [plan, gates, rust-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all producers to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          GATES_RESULT: ${{ needs.gates.result }}
          RUST_RESULT: ${{ needs.rust-gates.result }}
        run: |
          test "$PLAN_RESULT" = "success"
          test "$GATES_RESULT" = "success"
          test "$RUST_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Provision the pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Build the evidence verifiers
        run: |
          cargo build --manifest-path tools/gates/Cargo.toml --locked --release
          cargo build --manifest-path tools/qualification/Cargo.toml --locked --release
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Rebuild the expected candidate artifact identity
        run: bun run cli:build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-gate-plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-gate-receipt-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-qualification-*
          path: ${{ runner.temp }}/qualifications
      - name: Verify all planned lane receipts
        run: tools/gates/target/release/semctx-gates aggregate --root "$GITHUB_WORKSPACE" --plan "$RUNNER_TEMP/plan/gate-plan.json" --receipts "$RUNNER_TEMP/receipts"
      - name: Verify all native qualification reports
        run: tools/qualification/target/release/semctx-qualification verify --reports "$RUNNER_TEMP/qualifications" --plan "$RUNNER_TEMP/plan/gate-plan.json" --cli "$GITHUB_WORKSPACE/apps/cli/dist/index.js" --mcp "$GITHUB_WORKSPACE/plugins/semctx-control/dist/semctx-mcp.js"
