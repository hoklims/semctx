name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    name: verify release source
    if: github.repository == 'hoklims/semctx'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          no-cache: true
      - name: Verify release tag matches the package version and main ancestry
        shell: bash
        run: |
          bun -e "import p from './apps/cli/package.json';
          const tag = process.env.GITHUB_REF_NAME ?? '';
          if (tag !== 'v' + p.version) throw new Error('release tag ' + tag + ' != v' + p.version)"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - run: npm install --global npm@12.0.1 # zizmor: ignore[adhoc-packages] exact package-builder pin
      - run: python -m pip install --disable-pip-version-check --requirement requirements-quality.txt
      - run: bun install --frozen-lockfile
      - run: bun run verify:pr -- --skip-diff
      - name: Build and checksum the immutable npm package
        shell: bash
        run: |
          bun run cli:build
          bun -e 'const path = "apps/cli/package.json";
          const pkg = await Bun.file(path).json();
          pkg.gitHead = process.env.GITHUB_SHA;
          await Bun.write(path, JSON.stringify(pkg, null, 2) + "\n")'

          package_dir="$RUNNER_TEMP/npm-package"
          version="${GITHUB_REF_NAME#v}"
          tarball="semctx-$version.tgz"
          mkdir -p "$package_dir"
          npm pack --ignore-scripts --pack-destination "$package_dir" ./apps/cli
          test -f "$package_dir/$tarball"

          manifest="$(tar -xOf "$package_dir/$tarball" package/package.json)"
          MANIFEST="$manifest" EXPECTED_VERSION="$version" node -e '
          const manifest = JSON.parse(process.env.MANIFEST);
          if (manifest.name !== "semctx") throw new Error("unexpected package name");
          if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error("unexpected package version");
          if (manifest.gitHead !== process.env.GITHUB_SHA) throw new Error("unexpected package gitHead");'

          (
            cd "$package_dir"
            sha256sum "$tarball" > "$tarball.sha256"
          )
      - id: upload
        name: Upload the verified npm package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: publish npm package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install --global npm@12.0.1 # zizmor: ignore[adhoc-packages] exact OIDC publisher pin
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package
      - name: Publish semctx to npm or prove the existing version is this commit
        working-directory: ${{ runner.temp }}/npm-package
        shell: bash
        run: |
          shopt -s nullglob
          archives=(*.tgz)
          checksums=(*.sha256)
          test "${#archives[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          sha256sum --check "${checksums[0]}"

          version="${GITHUB_REF_NAME#v}"
          tarball="${archives[0]}"
          test "$tarball" = "semctx-$version.tgz"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          MANIFEST="$manifest" EXPECTED_VERSION="$version" node -e '
          const manifest = JSON.parse(process.env.MANIFEST);
          if (manifest.name !== "semctx") throw new Error("unexpected package name");
          if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error("unexpected package version");
          if (manifest.gitHead !== process.env.GITHUB_SHA) throw new Error("unexpected package gitHead");'

          npm_view_field() {
            local field="$1"
            local error_file="$RUNNER_TEMP/npm-view-$field.err"
            local output
            local status
            if output="$(npm view "semctx@$version" "$field" 2>"$error_file")"; then
              printf '%s' "$output" | tr -d '\r\n'
              return 0
            else
              status=$?
              if grep -q 'E404' "$error_file"; then
                return 44
              fi
              cat "$error_file" >&2
              return "$status"
            fi
          }

          lookup_status=0
          published_version="$(npm_view_field version)" || lookup_status=$?
          if [[ "$lookup_status" -eq 44 ]]; then
            published_version=""
          elif [[ "$lookup_status" -ne 0 ]]; then
            exit "$lookup_status"
          fi

          if [[ -n "$published_version" ]]; then
            lookup_status=0
            published_sha="$(npm_view_field gitHead)" || lookup_status=$?
            if [[ "$lookup_status" -ne 0 ]]; then
              exit "$lookup_status"
            fi
            if [[ "$published_version" != "$version" || "$published_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::semctx@$version exists without the expected gitHead $GITHUB_SHA"
              exit 1
            fi
          else
            npm publish "$tarball" --access public --ignore-scripts
          fi
          for attempt in {1..12}; do
            lookup_status=0
            confirmed_sha="$(npm_view_field gitHead)" || lookup_status=$?
            if [[ "$lookup_status" -eq 0 ]]; then
              if [[ "$confirmed_sha" == "$GITHUB_SHA" ]]; then
                exit 0
              fi
            elif [[ "$lookup_status" -ne 44 ]]; then
              exit "$lookup_status"
            fi
            sleep 5
          done
          echo "::error::npm never exposed semctx@$version with gitHead $GITHUB_SHA"
          exit 1

  promote:
    name: promote verified release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Advance the stable plugin channel after npm is public
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          stable_error="$RUNNER_TEMP/stable-ref.err"
          if stable_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/stable" --jq .object.sha 2>"$stable_error")"; then
            :
          else
            status=$?
            if grep -q 'HTTP 404' "$stable_error"; then
              stable_sha=""
            else
              cat "$stable_error" >&2
              exit "$status"
            fi
          fi
          if [[ -z "$stable_sha" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/stable" -f sha="$GITHUB_SHA"
          elif [[ "$stable_sha" != "$GITHUB_SHA" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/stable" \
              -f sha="$GITHUB_SHA" -F force=false
          fi
      - name: Create the GitHub Release after npm is public
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_error="$RUNNER_TEMP/github-release.err"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --silent 2>"$release_error"; then
            exit 0
          else
            status=$?
            if ! grep -q 'HTTP 404' "$release_error"; then
              cat "$release_error" >&2
              exit "$status"
            fi
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes

  deliver:
    name: prove stable marketplace delivery
    # Only after npm is public and `stable` points at this commit: installing from a marketplace
    # that has not been promoted yet would prove the previous release, not this one.
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Reserve the delivery proof artifact
        env:
          SEMCTX_DELIVERY_PROOF_OUTPUT: ${{ runner.temp }}/delivery-proof/stable-delivery-proof.json
        shell: bash
        run: |
          # Written before anything else can fail. A provisioning error, an import error, a syntax
          # error or a crash before main() would otherwise upload an empty directory and leave the
          # failure undiagnosable. `stage: placeholder` is exactly what the proof script's read-back
          # refuses, so this file can never be mistaken for evidence — it only guarantees that
          # *something* parseable is always archived.
          mkdir -p "$(dirname "$SEMCTX_DELIVERY_PROOF_OUTPUT")"
          version="${GITHUB_REF_NAME#v}"
          cat > "$SEMCTX_DELIVERY_PROOF_OUTPUT" <<JSON
          {
            "schemaVersion": 2,
            "kind": "stable_delivery_proof",
            "stage": "placeholder",
            "ok": false,
            "release": { "sha": "$GITHUB_SHA", "tag": "$GITHUB_REF_NAME", "version": "$version" },
            "run": {
              "repository": "$GITHUB_REPOSITORY",
              "runId": "$GITHUB_RUN_ID",
              "runAttempt": "$GITHUB_RUN_ATTEMPT",
              "verifierSha": "$GITHUB_SHA"
            },
            "detail": "the proof script never produced a verdict",
            "reasons": ["PROOF_NOT_COMPLETED"]
          }
          JSON
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 1 still carries the released commit and its complete tree, which is all the
          # blob-addressed witness needs; a full history would only slow the job.
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
          no-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Provision both host CLIs # zizmor: ignore[adhoc-packages] host CLIs under proof, pinned in scripts/prove-stable-delivery.ts
        shell: bash
        run: |
          # The two specifiers are the exact ones HOST_CLI_SPECIFICATION pins in
          # scripts/prove-stable-delivery.ts, and plugins/plugin-parity.test.ts fails when they
          # drift apart. A repository variable would make the proof depend on mutable state outside
          # the commit: an unset one is silently empty, and a changed one rewrites what a past run
          # meant. An absent binary fails now, because a skipped host would silently reduce the
          # proof to the other one. The versions each CLI *actually* resolves to are read from npm
          # by the proof itself and archived, so this step names the intent and the artifact
          # records the outcome.
          npm install --global "@openai/codex@0.147.0" "@anthropic-ai/claude-code@2.1.229"
          command -v codex
          command -v claude
      - run: bun install --frozen-lockfile
      - name: Prove both hosts can install the promoted release
        env:
          SEMCTX_DELIVERY_SANDBOX: ${{ runner.temp }}/delivery-sandbox
          SEMCTX_RELEASE_CHECKOUT: ${{ github.workspace }}
          SEMCTX_FOREIGN_REPOSITORY: ${{ runner.temp }}/foreign-repository
          SEMCTX_DELIVERY_PROOF_OUTPUT: ${{ runner.temp }}/delivery-proof/stable-delivery-proof.json
        shell: bash
        run: |
          # The smokes run from a repository that is neither a plugin cache nor this checkout, so a
          # bundle that only works next to its build tree cannot pass.
          mkdir -p "$SEMCTX_FOREIGN_REPOSITORY" "$(dirname "$SEMCTX_DELIVERY_PROOF_OUTPUT")"
          git init --quiet "$SEMCTX_FOREIGN_REPOSITORY"
          printf 'export const value = 1;\n' > "$SEMCTX_FOREIGN_REPOSITORY/value.ts"
          git -C "$SEMCTX_FOREIGN_REPOSITORY" add .
          git -C "$SEMCTX_FOREIGN_REPOSITORY" \
            -c user.name="Semctx Release" -c user.email="semctx@example.test" \
            commit --quiet -m "delivery smoke fixture"
          verifier_sha="$(git rev-parse HEAD)"
          test "$verifier_sha" = "$GITHUB_SHA"
          git diff --quiet --exit-code
          git diff --cached --quiet --exit-code
          SEMCTX_PROOF_TOOL_SHA="$verifier_sha" bun scripts/prove-stable-delivery.ts
      - name: Upload the delivery proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stable-delivery-proof
          path: ${{ runner.temp }}/delivery-proof/stable-delivery-proof.json
          if-no-files-found: error
          retention-days: 90
